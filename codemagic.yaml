workflows:
  android-debug:
    name: BateBet Android Debug APK
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Instalar dependências npm
        script: |
          npm install
          npm install -D typescript @capacitor/assets
      - name: Gerar ícones e splash a partir de assets/
        script: |
          npx capacitor-assets generate --android
      - name: Sincronizar Capacitor com Android
        script: |
          npx cap sync android
      - name: Dar permissão ao gradlew
        script: |
          chmod +x android/gradlew
      - name: Build do APK debug
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
